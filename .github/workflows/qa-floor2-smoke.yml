name: QA Floor 2 Smoke Build

on:
  push:
    branches:
      - qa-floor2-smoke-20260922

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aggro-qa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
